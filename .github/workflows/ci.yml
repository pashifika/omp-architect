name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# CI never needs repository write access, including on fork pull requests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Install the pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Report toolchain versions
        timeout-minutes: 1
        run: |
          bun --version
          bunx tsc --version

      - name: Check workflow safety conventions
        timeout-minutes: 1
        run: bun run check:workflows

      - name: Check formatting, types, and unit tests
        timeout-minutes: 5
        run: bun run check

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Install the pinned Bun toolchain
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        timeout-minutes: 5
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Smoke-test against the pinned OMP runtime
        timeout-minutes: 5
        run: bun run test:smoke

      - name: Verify distributable package contents and installation
        timeout-minutes: 5
        run: bun run check:package

  # Stable, single branch-protection target. Every prerequisite must succeed;
  # an unexpected skip, cancellation, or failure must produce a red gate.
  ci:
    name: ci
    needs: [quality, integration]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required job results
        timeout-minutes: 1
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$RESULTS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"; then
            echo "ci: every prerequisite must finish successfully"
            exit 1
          fi
          echo "ci: all required jobs passed"
